name: Android CI & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Test, Lint & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests & lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Decode release keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/release.jks"
            echo "RELEASE_KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare release APK artifact
        id: apk
        run: |
          mkdir -p build-artifacts
          VERSION_TAG="${GITHUB_REF_NAME:-1.0}"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            OUT="build-artifacts/JioCall-${VERSION_TAG}-release.apk"
            cp app/build/outputs/apk/release/app-release.apk "$OUT"
          elif [ -f "releases/JioCall-${VERSION_TAG}-release.apk" ]; then
            OUT="build-artifacts/JioCall-${VERSION_TAG}-release.apk"
            cp "releases/JioCall-${VERSION_TAG}-release.apk" "$OUT"
          else
            OUT="build-artifacts/JioCall-${VERSION_TAG}-release-unsigned.apk"
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$OUT"
          fi
          echo "apk_path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: jiocall-release-apk
          path: ${{ steps.apk.outputs.apk_path }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release APK artifact
        uses: actions/download-artifact@v8
        with:
          name: jiocall-release-apk
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*.apk
